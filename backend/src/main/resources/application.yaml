spring:
  application:
    name: museo-backend
  datasource:
    url: jdbc:mysql://localhost:3306/museo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}

    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update   # crea y actualiza las tablas automáticamente
    open-in-view: false

server:
  port: 8080